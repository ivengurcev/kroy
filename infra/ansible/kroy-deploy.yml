---
- name: Transfer and build Kroy on the VPS
  hosts: kroy
  become: false
  vars:
    kroy_root: /srv/kroy
    kroy_user: kroy
    kroy_group: "{{ kroy_user }}"
    kroy_yarn_version: 4.18.1
    kroy_runtime: node
    kroy_bun_version: 1.4.4
    kroy_bun_binary: /usr/local/bin/bun
    kroy_local_root: "{{ playbook_dir }}/../.."
  tasks:
    - name: Validate selected Kroy runtime
      ansible.builtin.assert:
        that: kroy_runtime in ['node', 'bun']
        fail_msg: "kroy_runtime must be node or bun"

    - name: Check Node.js version on the VPS
      ansible.builtin.command: node --version
      register: kroy_remote_node_version
      changed_when: false
      failed_when: false

    - name: Require bootstrapped Node.js environment
      ansible.builtin.assert:
        that:
          - kroy_remote_node_version.rc == 0
          - (kroy_remote_node_version.stdout | trim) == 'v24.19.0'
        fail_msg: "Node.js v24.19.0 is required on the VPS. Run infra/ansible/kroy-bootstrap.yml first."

    - name: Check Bun version on the VPS
      ansible.builtin.command: "{{ kroy_bun_binary }} --version"
      register: kroy_remote_bun_version
      changed_when: false
      failed_when: false
      when: kroy_runtime == 'bun'

    - name: Require bootstrapped Bun environment
      ansible.builtin.assert:
        that:
          - kroy_remote_bun_version.rc == 0
          - (kroy_remote_bun_version.stdout | trim) == kroy_bun_version
        fail_msg: "Bun {{ kroy_bun_version }} is required. Run kroy-bootstrap.yml with kroy_runtime=bun first."
      when: kroy_runtime == 'bun'

    - name: Install Kroy dependencies locally
      ansible.builtin.command:
        cmd: yarn install --immutable
        chdir: "{{ kroy_local_root }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true

    - name: Check local Yarn PnP artifacts
      ansible.builtin.stat:
        path: "{{ kroy_local_root }}/{{ item }}"
      loop:
        - .pnp.cjs
        - .pnp.loader.mjs
        - .yarn/cache
        - .yarn/unplugged
        - ".yarn/releases/yarn-{{ kroy_yarn_version }}.cjs"
        - .yarnrc.yml
      register: kroy_local_yarn_artifacts
      delegate_to: localhost
      become: false
      run_once: true

    - name: Require local Yarn PnP artifacts
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "Missing local Yarn artifact: {{ item.stat.path }}"
      loop: "{{ kroy_local_yarn_artifacts.results }}"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Build Kroy locally
      ansible.builtin.command:
        cmd: yarn vyaz:build
        chdir: "{{ kroy_local_root }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true

    - name: Synchronize Kroy sources without deleting server data
      ansible.posix.synchronize:
        src: "{{ kroy_local_root }}/"
        dest: "{{ kroy_root }}/"
        archive: true
        delete: false
        owner: false
        group: false
        perms: true
        rsync_opts:
          - "--chmod=D2770,Fug+rwX,o-rwx"
          - "--omit-dir-times"
          - "--exclude=.git"
          - "--exclude=.env"
          - "--exclude=dist/sites/"
          - "--exclude=dist/kroy/staging/"
          - "--exclude=dist/kroy/nginx/"
          - "--exclude=data/"
          - "--exclude=/node_modules/"
          - "--exclude=.cache/"
          - "--exclude=*.log"
          - "--exclude=infra/ansible/"
      register: kroy_sync_result

    - name: Install Bun-compatible dependencies immutably on the VPS
      ansible.builtin.command:
        argv: [sudo, -n, -u, "{{ kroy_user }}", /usr/local/sbin/kroy-run, deps:install]
      when: kroy_runtime == 'bun'
      changed_when: true

    - name: Verify selected runtime can import Vyaz
      ansible.builtin.command:
        argv: [sudo, -n, -u, "{{ kroy_user }}", /usr/local/sbin/kroy-run, runtime:verify]
      changed_when: false

    - name: Read current Kroy Nginx configuration checksum
      ansible.builtin.stat:
        path: "{{ kroy_root }}/dist/kroy/nginx/nginx.conf"
        checksum_algorithm: sha256
      register: kroy_nginx_config_before

    - name: Regenerate Kroy Nginx main configuration
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - -u
          - "{{ kroy_user }}"
          - /usr/local/sbin/kroy-run
          - nginx:init
      changed_when: false

    - name: Read generated Kroy Nginx configuration checksum
      ansible.builtin.stat:
        path: "{{ kroy_root }}/dist/kroy/nginx/nginx.conf"
        checksum_algorithm: sha256
      register: kroy_nginx_config_after

    - name: Mark Kroy Nginx configuration changes
      ansible.builtin.set_fact:
        kroy_nginx_config_changed: >-
          {{ (not kroy_nginx_config_before.stat.exists)
             or kroy_nginx_config_before.stat.checksum != kroy_nginx_config_after.stat.checksum }}

    - name: Validate Kroy Nginx configuration
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - -u
          - "{{ kroy_user }}"
          - /usr/local/sbin/kroy-run
          - nginx:validate
      when: kroy_nginx_config_changed | default(false) | bool
      changed_when: false

    - name: Check whether Kroy Nginx is already running
      ansible.builtin.service_facts:
      when: kroy_nginx_config_changed | default(false) | bool

    - name: Reload Kroy Nginx after configuration changes
      ansible.builtin.command:
        argv: [sudo, -n, /usr/bin/systemctl, reload, kroy-nginx]
      when:
        - kroy_nginx_config_changed | default(false) | bool
        - "'kroy-nginx.service' in ansible_facts.services"
        - ansible_facts.services['kroy-nginx.service'].state == 'running'

    - name: Apply PostgreSQL migrations
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - -u
          - "{{ kroy_user }}"
          - /usr/local/sbin/kroy-run
          - db:migrate
      changed_when: true

    - name: Restart Kroy application after deployment is ready
      ansible.builtin.command:
        argv: [sudo, -n, /usr/bin/systemctl, restart, kroy-app]
      changed_when: true

    - name: Verify Kroy application is active
      ansible.builtin.command:
        argv: [sudo, -n, /usr/bin/systemctl, is-active, --quiet, kroy-app]
      changed_when: false
