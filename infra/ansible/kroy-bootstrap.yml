---
- name: Bootstrap Kroy host
  hosts: kroy
  become: true
  vars:
    kroy_root: /srv/kroy
    kroy_user: kroy
    kroy_group: "{{ kroy_user }}"
    kroy_bun_version: 1.4.4
    kroy_bun_binary: /usr/local/bin/bun
  tasks:
    - name: Require supported host for Bun runtime
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version == '24.04'
          - ansible_facts.architecture == 'x86_64'
        fail_msg: "Bun deployment supports Ubuntu 24.04 x86_64 only"
      tags: [bun-install]

    - name: Install Kroy system dependencies
      ansible.builtin.apt:
        name:
          - nginx
          - postgresql
          - rsync
          - acl
          - python3-psycopg2
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install unzip for Bun archive extraction
      ansible.builtin.apt:
        name: unzip
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: [bun-install]

    - name: Check installed Bun version
      ansible.builtin.command: "{{ kroy_bun_binary }} --version"
      register: kroy_installed_bun_version
      changed_when: false
      failed_when: false
      tags: [bun-install]

    - name: Download pinned Bun release
      ansible.builtin.get_url:
        url: "https://github.com/oven-sh/bun/releases/download/bun-v{{ kroy_bun_version }}/bun-linux-x64-baseline.zip"
        dest: "/var/tmp/bun-v{{ kroy_bun_version }}-linux-x64-baseline.zip"
        checksum: sha256:e0446eb55995772eb9894bebae9a6be368d985a8b9271ee124486f9946eedd76
        mode: '0644'
      when:
        - kroy_installed_bun_version.rc != 0 or (kroy_installed_bun_version.stdout | trim) != kroy_bun_version
      tags: [bun-install]

    - name: Create temporary Bun extraction directory
      ansible.builtin.file:
        path: "/var/tmp/kroy-bun-v{{ kroy_bun_version }}"
        state: directory
        mode: '0755'
      when:
        - kroy_installed_bun_version.rc != 0 or (kroy_installed_bun_version.stdout | trim) != kroy_bun_version
      tags: [bun-install]

    - name: Extract pinned Bun release
      ansible.builtin.unarchive:
        src: "/var/tmp/bun-v{{ kroy_bun_version }}-linux-x64-baseline.zip"
        dest: "/var/tmp/kroy-bun-v{{ kroy_bun_version }}"
        remote_src: true
      when:
        - kroy_installed_bun_version.rc != 0 or (kroy_installed_bun_version.stdout | trim) != kroy_bun_version
      tags: [bun-install]

    - name: Install Bun binary
      ansible.builtin.copy:
        src: "/var/tmp/kroy-bun-v{{ kroy_bun_version }}/bun-linux-x64-baseline/bun"
        dest: "{{ kroy_bun_binary }}"
        remote_src: true
        owner: root
        group: root
        mode: '0755'
      when:
        - kroy_installed_bun_version.rc != 0 or (kroy_installed_bun_version.stdout | trim) != kroy_bun_version
      tags: [bun-install]

    - name: Verify installed Bun version
      ansible.builtin.command: "{{ kroy_bun_binary }} --version"
      register: kroy_installed_bun_version_after
      changed_when: false
      tags: [bun-install]

    - name: Require exact Bun version
      ansible.builtin.assert:
        that: (kroy_installed_bun_version_after.stdout | trim) == kroy_bun_version
        fail_msg: "Expected Bun {{ kroy_bun_version }}, got {{ kroy_installed_bun_version_after.stdout | trim }}"
      tags: [bun-install]

    - name: Remove temporary Bun archive and extraction
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/var/tmp/bun-v{{ kroy_bun_version }}-linux-x64-baseline.zip"
        - "/var/tmp/kroy-bun-v{{ kroy_bun_version }}"
      tags: [bun-install]

    - name: Determine the SSH connection user
      ansible.builtin.command: id -un
      become: false
      register: kroy_connection_user
      changed_when: false
      check_mode: false

    - name: Ensure Kroy system group exists
      ansible.builtin.group:
        name: "{{ kroy_group }}"
        system: true
        state: present

    - name: Ensure Kroy service user exists without interactive login
      ansible.builtin.user:
        name: "{{ kroy_user }}"
        group: "{{ kroy_group }}"
        system: true
        home: "{{ kroy_root }}"
        create_home: false
        shell: /usr/sbin/nologin
        state: present

    - name: Add SSH user to the Kroy group
      ansible.builtin.user:
        name: "{{ kroy_connection_user.stdout | trim }}"
        groups: "{{ kroy_group }}"
        append: true
        state: present

    - name: Ensure Kroy working and runtime directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ kroy_user }}"
        group: "{{ kroy_group }}"
        mode: '2770'
      loop:
        - "{{ kroy_root }}"
        - "{{ kroy_root }}/data"

    - name: Install Kroy application systemd unit
      ansible.builtin.template:
        src: templates/kroy-app.service.j2
        dest: /etc/systemd/system/kroy-app.service
        mode: '0644'

    - name: Enable Kroy application at boot without starting it yet
      ansible.builtin.systemd:
        name: kroy-app
        enabled: true
        daemon_reload: true

    - name: Install protected Kroy command runner
      ansible.builtin.template:
        src: templates/kroy-run.j2
        dest: /usr/local/sbin/kroy-run
        owner: root
        group: root
        mode: '0755'

    - name: Allow SSH user to run Kroy scripts as kroy
      ansible.builtin.copy:
        dest: /etc/sudoers.d/kroy-run
        owner: root
        group: root
        mode: '0440'
        content: "{{ kroy_connection_user.stdout | trim }} ALL=(kroy) NOPASSWD: /usr/local/sbin/kroy-run *\n"
        validate: /usr/sbin/visudo -cf %s

    - name: Allow SSH user to manage only Kroy services
      ansible.builtin.copy:
        dest: /etc/sudoers.d/kroy-services
        owner: root
        group: root
        mode: '0440'
        content: |
          {{ kroy_connection_user.stdout | trim }} ALL=(root) NOPASSWD: /usr/bin/systemctl start kroy-app, /usr/bin/systemctl restart kroy-app, /usr/bin/systemctl start kroy-nginx, /usr/bin/systemctl reload kroy-nginx
        validate: /usr/sbin/visudo -cf %s

    - name: Remove legacy site deployment script
      ansible.builtin.file:
        path: /usr/local/sbin/kroy-site-deploy
        state: absent

    - name: Remove legacy site deployment sudoers rule
      ansible.builtin.file:
        path: /etc/sudoers.d/kroy-site-deploy
        state: absent

    - name: Check whether the existing environment file is present
      ansible.builtin.stat:
        path: "{{ kroy_env_file | default(kroy_root ~ '/.env') }}"
      register: kroy_env_stat

    - name: Read existing environment without exposing secrets
      ansible.builtin.slurp:
        src: "{{ kroy_env_file | default(kroy_root ~ '/.env') }}"
      register: kroy_env_slurp
      when: kroy_env_stat.stat.exists
      no_log: true

    - name: Extract existing database password and auth secret
      ansible.builtin.set_fact:
        kroy_database_password: "{{ ((kroy_env_slurp.content | b64decode | regex_findall('(?m)^KROY_DATABASE_PASSWORD=(.+)$')) | first | default('')) or (((kroy_env_slurp.content | b64decode | regex_findall('(?m)^DATABASE_URL=postgres://[^:]+:([^@]+)@')) | first | default(''))) }}"
        kroy_auth_secret: "{{ (kroy_env_slurp.content | b64decode | regex_findall('(?m)^AUTH_SECRET=(.+)$')) | first }}"
      when: kroy_env_stat.stat.exists
      no_log: true

    - name: Generate initial PostgreSQL password and Auth secret
      ansible.builtin.set_fact:
        kroy_database_password: "{{ lookup('ansible.builtin.password', '/dev/null length=48 chars=ascii_letters,digits') }}"
        kroy_auth_secret: "{{ lookup('ansible.builtin.password', '/dev/null length=64 chars=ascii_letters,digits') }}"
      when: not kroy_env_stat.stat.exists
      no_log: true

    - name: Require secrets in an existing environment file
      ansible.builtin.assert:
        that:
          - kroy_database_password | default('') | length > 0
          - kroy_auth_secret | default('') | length > 0
        fail_msg: 'Existing .env must contain KROY_DATABASE_PASSWORD and AUTH_SECRET'
      no_log: true

    - name: Ensure PostgreSQL role exists with LOGIN
      become_user: postgres
      community.postgresql.postgresql_user:
        name: "{{ kroy_database_user | default('kroy') }}"
        password: "{{ kroy_database_password }}"
        role_attr_flags: LOGIN
        state: present
      no_log: true

    - name: Ensure PostgreSQL database exists with Kroy owner
      become_user: postgres
      community.postgresql.postgresql_db:
        name: "{{ kroy_database_name | default('kroy') }}"
        owner: "{{ kroy_database_user | default('kroy') }}"
        state: present
      no_log: true

    - name: Create .env only when it does not exist
      ansible.builtin.copy:
        dest: "{{ kroy_env_file | default(kroy_root ~ '/.env') }}"
        content: |-
          DATABASE_URL=postgres://{{ kroy_database_user | default('kroy') }}:{{ kroy_database_password }}@{{ kroy_database_host | default('127.0.0.1') }}:{{ kroy_database_port | default(5432) }}/{{ kroy_database_name | default('kroy') }}
          KROY_DATABASE_PASSWORD={{ kroy_database_password }}
          AUTH_SECRET={{ kroy_auth_secret }}
        owner: "{{ kroy_user }}"
        group: "{{ kroy_group }}"
        mode: '0600'
        force: false
      when: not kroy_env_stat.stat.exists
      no_log: true

    - name: Enforce .env ownership and permissions without changing content
      ansible.builtin.file:
        path: "{{ kroy_env_file | default(kroy_root ~ '/.env') }}"
        owner: "{{ kroy_user }}"
        group: "{{ kroy_group }}"
        mode: '0600'

- import_playbook: kroy-nginx.yml
