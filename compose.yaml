services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: kroy
      POSTGRES_USER: kroy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kroy -d kroy"]
      interval: 2s
      timeout: 5s
      retries: 15

  migrate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://kroy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/kroy?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db/migrations:/db/migrations
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ["preview"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./dist/sites/demo:/srv:ro
      - ./dist/kroy/caddy/demo.Caddyfile:/etc/caddy/Caddyfile:ro
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]

volumes:
  postgres-data:
