<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F5F8F7">
  <meta name="description" content="Oysite — сайт в разработке.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Oysite — сайт в разработке</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { background: #F5F8F7; }
    body {
      margin: 0;
      color: #203330;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      padding: 24px;
    }
    .content { width: min(100%, 560px); text-align: center; }
    .logo { display: block; width: min(320px, 80vw); height: auto; margin: 0 auto; }
    h1 {
      margin: 40px 0 0;
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 500;
      letter-spacing: -0.025em;
      line-height: 1.25;
    }
  </style>
</head>
<body>
  <main>
    <div class="content">
      <img class="logo" src="/logo.svg" alt="Oysite">
      <h1>Сайт в разработке</h1>
    </div>
  </main>
</body>
</html>
