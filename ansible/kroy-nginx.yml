---
- name: Configure the separate Kroy Nginx instance
  hosts: kroy
  become: true
  vars:
    kroy_root: /srv/kroy
    kroy_user: kroy
    kroy_group: "{{ kroy_user }}"
    kroy_nginx_binary: /usr/sbin/nginx
    kroy_node_binary: /usr/bin/node
    kroy_nginx_config: "{{ kroy_root }}/dist/kroy/nginx/nginx.conf"
    kroy_letsencrypt_live: /etc/letsencrypt/live/oysite.ru
    kroy_domains:
      - '*.oysite.ru'
  tasks:
    - name: Check whether the Oysite certificate is available
      ansible.builtin.stat:
        path: "{{ kroy_letsencrypt_live }}/fullchain.pem"
      register: kroy_oysite_certificate

    - name: Check Oysite certificate validity
      ansible.builtin.command:
        argv: [openssl, x509, -in, "{{ kroy_letsencrypt_live }}/fullchain.pem", -noout, -checkend, '0']
      when: kroy_oysite_certificate.stat.exists
      register: kroy_oysite_certificate_valid
      changed_when: false

    - name: Check Oysite certificate names
      ansible.builtin.command:
        argv: [openssl, x509, -in, "{{ kroy_letsencrypt_live }}/fullchain.pem", -noout, -ext, subjectAltName]
      when: kroy_oysite_certificate.stat.exists and kroy_oysite_certificate_valid.rc == 0
      register: kroy_oysite_certificate_san
      changed_when: false

    - name: Determine whether HTTPS may be enabled
      ansible.builtin.set_fact:
        kroy_tls_enabled: >-
          {{ kroy_oysite_certificate.stat.exists
             and (kroy_oysite_certificate_valid.rc | default(1)) == 0
             and 'DNS:oysite.ru' in kroy_oysite_certificate_san.stdout | default('')
             and 'DNS:*.oysite.ru' in kroy_oysite_certificate_san.stdout | default('') }}

    - name: Install Kroy systemd unit
      ansible.builtin.template:
        src: templates/kroy-nginx.service.j2
        dest: /etc/systemd/system/kroy-nginx.service
        mode: '0644'
      notify: Restart Kroy Nginx

    - name: Add system Nginx reverse proxy for Oysite domains
      ansible.builtin.template:
        src: templates/oysite-proxy.conf.j2
        dest: /etc/nginx/conf.d/oysite-kroy.conf
        mode: '0644'
      vars:
        proxy_domains: "{{ kroy_domains }}"
        tls_enabled: "{{ kroy_tls_enabled }}"
      notify: Reload system Nginx

    - name: Ensure Oysite placeholder directory exists
      ansible.builtin.file:
        path: /var/www/oysite
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install Oysite placeholder page
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/oysite-placeholder/index.html"
        dest: /var/www/oysite/index.html
        owner: root
        group: root
        mode: '0644'

    - name: Install Oysite logo for placeholder
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../design/oysite-brand-kit/logo/oysite-logo.svg"
        dest: /var/www/oysite/logo.svg
        owner: root
        group: root
        mode: '0644'

    - name: Install Oysite favicon for placeholder
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../design/oysite-brand-kit/icons/favicon.svg"
        dest: /var/www/oysite/favicon.svg
        owner: root
        group: root
        mode: '0644'

    - name: Add Oysite placeholder virtual host
      ansible.builtin.template:
        src: templates/oysite-placeholder.conf.j2
        dest: /etc/nginx/conf.d/oysite-placeholder.conf
        mode: '0644'
      vars:
        tls_enabled: "{{ kroy_tls_enabled }}"
      notify: Reload system Nginx

    - name: Enable and start Kroy Nginx
      ansible.builtin.systemd:
        name: kroy-nginx
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart Kroy Nginx
      ansible.builtin.systemd:
        name: kroy-nginx
        state: restarted
        daemon_reload: true

    - name: Validate system Nginx
      ansible.builtin.command:
        argv: [nginx, -t]
      changed_when: false
      listen: Reload system Nginx

    - name: Reload system Nginx after validation
      ansible.builtin.service:
        name: nginx
        state: reloaded
      listen: Reload system Nginx
