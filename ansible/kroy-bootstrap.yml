---
- name: Bootstrap Kroy host
  hosts: kroy
  become: true
  vars:
    kroy_root: /srv/kroy
    kroy_user: kroy
    kroy_group: "{{ kroy_user }}"
  tasks:
    - name: Determine the SSH connection user
      ansible.builtin.command: id -un
      become: false
      register: kroy_connection_user
      changed_when: false
      check_mode: false

    - name: Ensure Kroy system group exists
      ansible.builtin.group:
        name: "{{ kroy_group }}"
        system: true
        state: present

    - name: Ensure Kroy service user exists without interactive login
      ansible.builtin.user:
        name: "{{ kroy_user }}"
        group: "{{ kroy_group }}"
        system: true
        create_home: false
        shell: /usr/sbin/nologin
        state: present

    - name: Add SSH user to the Kroy group
      ansible.builtin.user:
        name: "{{ kroy_connection_user.stdout | trim }}"
        groups: "{{ kroy_group }}"
        append: true
        state: present

    - name: Ensure Kroy working and runtime directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ kroy_user }}"
        group: "{{ kroy_group }}"
        mode: '2770'
      loop:
        - "{{ kroy_root }}"
        - "{{ kroy_root }}/data"
