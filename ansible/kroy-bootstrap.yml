---
- name: Bootstrap Kroy host
  hosts: kroy
  become: true
  vars:
    kroy_root: /srv/kroy
    kroy_user: kroy
    kroy_group: "{{ kroy_user }}"
    kroy_node_version: 24.19.0
    kroy_node_package_version: 24.19.0-1nodesource1
    kroy_yarn_version: 4.18.1
    kroy_node_binary: /usr/bin/node
    kroy_yarn_release: "{{ kroy_root }}/.yarn/releases/yarn-{{ kroy_yarn_version }}.cjs"
  tasks:
    - name: Install Kroy system dependencies
      ansible.builtin.apt:
        name:
          - nginx
          - postgresql
          - rsync
          - acl
          - python3-psycopg2
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure APT keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Install NodeSource signing key
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: /etc/apt/keyrings/nodesource.asc
        mode: '0644'

    - name: Configure NodeSource Node.js 24 repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_24.x nodistro main"
        filename: nodesource
        state: present
        update_cache: true

    - name: Check installed Node.js version before installation
      ansible.builtin.command: node --version
      register: kroy_installed_node_version
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install exact Node.js version
      ansible.builtin.command:
        argv:
          - apt-get
          - --yes
          - --no-remove
          - install
          - "nodejs={{ kroy_node_package_version }}"
      when:
        - kroy_installed_node_version.rc != 0 or (kroy_installed_node_version.stdout | trim) != ('v' ~ kroy_node_version)
      changed_when: true
      check_mode: false

    - name: Check installed Node.js version after installation
      ansible.builtin.command: node --version
      register: kroy_installed_node_version_after
      changed_when: false
      check_mode: false

    - name: Require exact Node.js version
      ansible.builtin.assert:
        that:
          - (kroy_installed_node_version_after.stdout | trim) == ('v' ~ kroy_node_version)
        fail_msg: "Expected Node.js v{{ kroy_node_version }}, got {{ kroy_installed_node_version_after.stdout | trim }}"

    - name: Enable Corepack and install Yarn shims
      ansible.builtin.command: corepack enable --install-directory /usr/local/bin
      changed_when: false
      check_mode: false

    - name: Determine the SSH connection user
      ansible.builtin.command: id -un
      become: false
      register: kroy_connection_user
      changed_when: false
      check_mode: false

    - name: Ensure Kroy system group exists
      ansible.builtin.group:
        name: "{{ kroy_group }}"
        system: true
        state: present

    - name: Ensure Kroy service user exists without interactive login
      ansible.builtin.user:
        name: "{{ kroy_user }}"
        group: "{{ kroy_group }}"
        system: true
        home: "{{ kroy_root }}"
        create_home: false
        shell: /usr/sbin/nologin
        state: present

    - name: Add SSH user to the Kroy group
      ansible.builtin.user:
        name: "{{ kroy_connection_user.stdout | trim }}"
        groups: "{{ kroy_group }}"
        append: true
        state: present

    - name: Ensure Kroy working and runtime directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ kroy_user }}"
        group: "{{ kroy_group }}"
        mode: '2770'
      loop:
        - "{{ kroy_root }}"
        - "{{ kroy_root }}/data"

    - name: Install Kroy application systemd unit
      ansible.builtin.template:
        src: templates/kroy-app.service.j2
        dest: /etc/systemd/system/kroy-app.service
        mode: '0644'

    - name: Enable Kroy application at boot without starting it yet
      ansible.builtin.systemd:
        name: kroy-app
        enabled: true
        daemon_reload: true

    - name: Install protected Kroy command runner
      ansible.builtin.template:
        src: templates/kroy-run.j2
        dest: /usr/local/sbin/kroy-run
        owner: root
        group: root
        mode: '0755'

    - name: Allow SSH user to run Kroy scripts as kroy
      ansible.builtin.copy:
        dest: /etc/sudoers.d/kroy-run
        owner: root
        group: root
        mode: '0440'
        content: "{{ kroy_connection_user.stdout | trim }} ALL=(kroy) NOPASSWD: /usr/local/sbin/kroy-run *\n"
        validate: /usr/sbin/visudo -cf %s

    - name: Allow SSH user to manage only Kroy services
      ansible.builtin.copy:
        dest: /etc/sudoers.d/kroy-services
        owner: root
        group: root
        mode: '0440'
        content: |
          {{ kroy_connection_user.stdout | trim }} ALL=(root) NOPASSWD: /usr/bin/systemctl start kroy-app, /usr/bin/systemctl restart kroy-app, /usr/bin/systemctl reload kroy-nginx
        validate: /usr/sbin/visudo -cf %s

    - name: Remove legacy site deployment script
      ansible.builtin.file:
        path: /usr/local/sbin/kroy-site-deploy
        state: absent

    - name: Remove legacy site deployment sudoers rule
      ansible.builtin.file:
        path: /etc/sudoers.d/kroy-site-deploy
        state: absent

    - name: Check whether the existing environment file is present
      ansible.builtin.stat:
        path: "{{ kroy_env_file | default(kroy_root ~ '/.env') }}"
      register: kroy_env_stat

    - name: Read existing environment without exposing secrets
      ansible.builtin.slurp:
        src: "{{ kroy_env_file | default(kroy_root ~ '/.env') }}"
      register: kroy_env_slurp
      when: kroy_env_stat.stat.exists
      no_log: true

    - name: Extract existing database password and auth secret
      ansible.builtin.set_fact:
        kroy_database_password: "{{ ((kroy_env_slurp.content | b64decode | regex_findall('(?m)^KROY_DATABASE_PASSWORD=(.+)$')) | first | default('')) or (((kroy_env_slurp.content | b64decode | regex_findall('(?m)^DATABASE_URL=postgres://[^:]+:([^@]+)@')) | first | default(''))) }}"
        kroy_auth_secret: "{{ (kroy_env_slurp.content | b64decode | regex_findall('(?m)^AUTH_SECRET=(.+)$')) | first }}"
      when: kroy_env_stat.stat.exists
      no_log: true

    - name: Generate initial PostgreSQL password and Auth secret
      ansible.builtin.set_fact:
        kroy_database_password: "{{ lookup('ansible.builtin.password', '/dev/null length=48 chars=ascii_letters,digits') }}"
        kroy_auth_secret: "{{ lookup('ansible.builtin.password', '/dev/null length=64 chars=ascii_letters,digits') }}"
      when: not kroy_env_stat.stat.exists
      no_log: true

    - name: Require secrets in an existing environment file
      ansible.builtin.assert:
        that:
          - kroy_database_password | default('') | length > 0
          - kroy_auth_secret | default('') | length > 0
        fail_msg: 'Existing .env must contain KROY_DATABASE_PASSWORD and AUTH_SECRET'
      no_log: true

    - name: Ensure PostgreSQL role exists with LOGIN
      become_user: postgres
      community.postgresql.postgresql_user:
        name: "{{ kroy_database_user | default('kroy') }}"
        password: "{{ kroy_database_password }}"
        role_attr_flags: LOGIN
        state: present
      no_log: true

    - name: Ensure PostgreSQL database exists with Kroy owner
      become_user: postgres
      community.postgresql.postgresql_db:
        name: "{{ kroy_database_name | default('kroy') }}"
        owner: "{{ kroy_database_user | default('kroy') }}"
        state: present
      no_log: true

    - name: Create .env only when it does not exist
      ansible.builtin.copy:
        dest: "{{ kroy_env_file | default(kroy_root ~ '/.env') }}"
        content: |-
          DATABASE_URL=postgres://{{ kroy_database_user | default('kroy') }}:{{ kroy_database_password }}@{{ kroy_database_host | default('127.0.0.1') }}:{{ kroy_database_port | default(5432) }}/{{ kroy_database_name | default('kroy') }}
          KROY_DATABASE_PASSWORD={{ kroy_database_password }}
          AUTH_SECRET={{ kroy_auth_secret }}
        owner: "{{ kroy_user }}"
        group: "{{ kroy_group }}"
        mode: '0600'
        force: false
      when: not kroy_env_stat.stat.exists
      no_log: true

    - name: Enforce .env ownership and permissions without changing content
      ansible.builtin.file:
        path: "{{ kroy_env_file | default(kroy_root ~ '/.env') }}"
        owner: "{{ kroy_user }}"
        group: "{{ kroy_group }}"
        mode: '0600'
