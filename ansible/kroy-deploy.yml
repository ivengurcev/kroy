---
- name: Transfer and build Kroy on the VPS
  hosts: kroy
  become: false
  vars:
    kroy_root: /srv/kroy
    kroy_user: kroy
    kroy_group: "{{ kroy_user }}"
    kroy_yarn_version: 4.18.1
    kroy_node_binary: /usr/bin/node
    kroy_yarn_release: "{{ kroy_root }}/.yarn/releases/yarn-{{ kroy_yarn_version }}.cjs"
    kroy_local_root: "{{ playbook_dir }}/.."
  tasks:
    - name: Check Node.js version on the VPS
      ansible.builtin.command: node --version
      register: kroy_remote_node_version
      changed_when: false
      failed_when: false

    - name: Require bootstrapped Node.js environment
      ansible.builtin.assert:
        that:
          - kroy_remote_node_version.rc == 0
          - (kroy_remote_node_version.stdout | trim) == 'v24.19.0'
        fail_msg: "Node.js v24.19.0 is required on the VPS. Run ansible/kroy-bootstrap.yml first."

    - name: Install Kroy dependencies locally
      ansible.builtin.command:
        cmd: yarn install --immutable
        chdir: "{{ kroy_local_root }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true

    - name: Check local Yarn PnP artifacts
      ansible.builtin.stat:
        path: "{{ kroy_local_root }}/{{ item }}"
      loop:
        - .pnp.cjs
        - .pnp.loader.mjs
        - .yarn/cache
        - .yarn/unplugged
        - ".yarn/releases/yarn-{{ kroy_yarn_version }}.cjs"
        - .yarnrc.yml
      register: kroy_local_yarn_artifacts
      delegate_to: localhost
      become: false
      run_once: true

    - name: Require local Yarn PnP artifacts
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "Missing local Yarn artifact: {{ item.stat.path }}"
      loop: "{{ kroy_local_yarn_artifacts.results }}"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Build Kroy locally
      ansible.builtin.command:
        cmd: yarn vyaz:build
        chdir: "{{ kroy_local_root }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true

    - name: Synchronize Kroy sources without deleting server data
      ansible.posix.synchronize:
        src: "{{ kroy_local_root }}/"
        dest: "{{ kroy_root }}/"
        archive: true
        delete: false
        owner: false
        group: false
        perms: true
        rsync_opts:
          - "--chmod=D2770,Fug+rwX,o-rwx"
          - "--omit-dir-times"
          - "--exclude=.git"
          - "--exclude=.env"
          - "--exclude=dist/sites/"
          - "--exclude=dist/kroy/staging/"
          - "--exclude=dist/kroy/nginx/"
          - "--exclude=data/"
          - "--exclude=/node_modules/"
          - "--exclude=.cache/"
          - "--exclude=*.log"
          - "--exclude=ansible/"
      notify:
        - Restart Kroy app
      register: kroy_sync_result

    - name: Read current Kroy Nginx configuration checksum
      ansible.builtin.stat:
        path: "{{ kroy_root }}/dist/kroy/nginx/nginx.conf"
        checksum_algorithm: sha256
      register: kroy_nginx_config_before

    - name: Regenerate Kroy Nginx main configuration
      become: true
      become_user: "{{ kroy_user }}"
      ansible.builtin.command:
        cmd: "{{ kroy_node_binary }} scripts/initNginx.mjs"
        chdir: "{{ kroy_root }}"
      changed_when: false

    - name: Read generated Kroy Nginx configuration checksum
      ansible.builtin.stat:
        path: "{{ kroy_root }}/dist/kroy/nginx/nginx.conf"
        checksum_algorithm: sha256
      register: kroy_nginx_config_after

    - name: Mark Kroy Nginx configuration changes
      ansible.builtin.set_fact:
        kroy_nginx_config_changed: >-
          {{ (not kroy_nginx_config_before.stat.exists)
             or kroy_nginx_config_before.stat.checksum != kroy_nginx_config_after.stat.checksum }}

    - name: Validate Kroy Nginx configuration
      become: true
      ansible.builtin.command:
        argv:
          - /usr/sbin/nginx
          - -t
          - -c
          - "{{ kroy_root }}/dist/kroy/nginx/nginx.conf"
      when: kroy_nginx_config_changed | default(false) | bool
      changed_when: false

    - name: Check whether Kroy Nginx is already running
      ansible.builtin.service_facts:
      when: kroy_nginx_config_changed | default(false) | bool

    - name: Reload Kroy Nginx after configuration changes
      become: true
      ansible.builtin.systemd:
        name: kroy-nginx
        state: reloaded
      when:
        - kroy_nginx_config_changed | default(false) | bool
        - "'kroy-nginx.service' in ansible_facts.services"
        - ansible_facts.services['kroy-nginx.service'].state == 'running'

    - name: Apply PostgreSQL migrations
      become: true
      become_user: "{{ kroy_user }}"
      ansible.builtin.command:
        argv:
          - "{{ kroy_node_binary }}"
          - "{{ kroy_yarn_release }}"
          - db:migrate
        chdir: "{{ kroy_root }}"
      changed_when: true

    - name: Ensure Kroy application is enabled and started
      become: true
      ansible.builtin.systemd:
        name: kroy-app
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart Kroy app
      become: true
      ansible.builtin.systemd:
        name: kroy-app
        state: restarted
