---
- name: Transfer and build Kroy on the VPS
  hosts: kroy
  become: false
  vars:
    kroy_root: /srv/kroy
    kroy_user: kroy
    kroy_group: "{{ kroy_user }}"
    kroy_yarn_version: 4.18.1
    kroy_node_binary: /usr/bin/node
    kroy_yarn_release: "{{ kroy_root }}/.yarn/releases/yarn-{{ kroy_yarn_version }}.cjs"
    kroy_local_root: "{{ playbook_dir }}/.."
  tasks:
    - name: Check Node.js version on the VPS
      ansible.builtin.command: node --version
      register: kroy_remote_node_version
      changed_when: false
      failed_when: false

    - name: Require bootstrapped Node.js environment
      ansible.builtin.assert:
        that:
          - kroy_remote_node_version.rc == 0
          - (kroy_remote_node_version.stdout | trim) == 'v24.19.0'
        fail_msg: "Node.js v24.19.0 is required on the VPS. Run ansible/kroy-bootstrap.yml first."

    - name: Install Kroy dependencies locally
      ansible.builtin.command:
        cmd: yarn install --immutable
        chdir: "{{ kroy_local_root }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true

    - name: Check local Yarn PnP artifacts
      ansible.builtin.stat:
        path: "{{ kroy_local_root }}/{{ item }}"
      loop:
        - .pnp.cjs
        - .pnp.loader.mjs
        - .yarn/cache
        - .yarn/unplugged
        - ".yarn/releases/yarn-{{ kroy_yarn_version }}.cjs"
        - .yarnrc.yml
      register: kroy_local_yarn_artifacts
      delegate_to: localhost
      become: false
      run_once: true

    - name: Require local Yarn PnP artifacts
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "Missing local Yarn artifact: {{ item.stat.path }}"
      loop: "{{ kroy_local_yarn_artifacts.results }}"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Build Kroy locally
      ansible.builtin.command:
        cmd: yarn vyaz:build
        chdir: "{{ kroy_local_root }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true

    - name: Synchronize Kroy sources without deleting server data
      ansible.posix.synchronize:
        src: "{{ kroy_local_root }}/"
        dest: "{{ kroy_root }}/"
        archive: true
        delete: false
        owner: false
        group: false
        perms: true
        rsync_opts:
          - "--chmod=D2770,Fug+rwX,o-rwx"
          - "--omit-dir-times"
          - "--exclude=.git"
          - "--exclude=.env"
          - "--exclude=dist/sites/"
          - "--exclude=dist/kroy/staging/"
          - "--exclude=dist/kroy/nginx/"
          - "--exclude=data/"
          - "--exclude=/node_modules/"
          - "--exclude=.cache/"
          - "--exclude=*.log"
          - "--exclude=ansible/"
      notify:
        - Restart Kroy app
      register: kroy_sync_result

    - name: Mark Kroy Nginx for reload after application changes
      ansible.builtin.set_fact:
        kroy_nginx_reload_required: "{{ kroy_sync_result.changed }}"

    - name: Regenerate Kroy Nginx main configuration
      become: true
      become_user: "{{ kroy_user }}"
      ansible.builtin.command:
        cmd: "{{ kroy_node_binary }} scripts/initNginx.mjs"
        chdir: "{{ kroy_root }}"
      changed_when: false

    - name: Validate Kroy Nginx configuration
      become: true
      ansible.builtin.command:
        argv:
          - /usr/sbin/nginx
          - -t
          - -c
          - "{{ kroy_root }}/dist/kroy/nginx/nginx.conf"
      changed_when: false

    - name: Determine the SSH connection user for site deployment
      ansible.builtin.command: id -un
      become: false
      register: kroy_deploy_ssh_user
      changed_when: false
      check_mode: false

    - name: Install protected site deployment script
      become: true
      ansible.builtin.template:
        src: templates/kroy-site-deploy.j2
        dest: /usr/local/sbin/kroy-site-deploy
        owner: root
        group: root
        mode: '0755'
      notify: Restart Kroy app

    - name: Allow SSH user to run only site deployment as kroy
      become: true
      ansible.builtin.copy:
        dest: /etc/sudoers.d/kroy-site-deploy
        owner: root
        group: root
        mode: '0440'
        content: "{{ kroy_deploy_ssh_user.stdout | trim }} ALL=(kroy) NOPASSWD: /usr/local/sbin/kroy-site-deploy *\n"
        validate: /usr/sbin/visudo -cf %s

    - name: Apply PostgreSQL migrations
      become: true
      become_user: "{{ kroy_user }}"
      ansible.builtin.command:
        argv:
          - "{{ kroy_node_binary }}"
          - "{{ kroy_yarn_release }}"
          - db:migrate
        chdir: "{{ kroy_root }}"
      changed_when: true

    - name: Install Kroy application systemd unit
      become: true
      ansible.builtin.template:
        src: templates/kroy-app.service.j2
        dest: /etc/systemd/system/kroy-app.service
        mode: '0644'
      notify: Restart Kroy app

    - name: Enable and start Kroy application before Nginx
      become: true
      ansible.builtin.systemd:
        name: kroy-app
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart Kroy app
      become: true
      ansible.builtin.systemd:
        name: kroy-app
        state: restarted

    - name: Reload Kroy Nginx
      become: true
      ansible.builtin.systemd:
        name: kroy-nginx
        state: reloaded

- import_playbook: kroy-nginx.yml
