---
- import_playbook: kroy-provision.yml

- name: Transfer and build Kroy on the VPS
  hosts: kroy
  become: false
  vars:
    kroy_root: /srv/kroy
    kroy_user: kroy
    kroy_group: "{{ kroy_user }}"
    kroy_yarn_version: 4.18.1
    kroy_node_binary: /usr/bin/node
    kroy_yarn_release: "{{ kroy_root }}/.yarn/releases/yarn-{{ kroy_yarn_version }}.cjs"
    kroy_local_root: "{{ playbook_dir }}/.."
  tasks:
    - name: Pin the project Yarn release locally
      ansible.builtin.command:
        cmd: "yarn set version {{ kroy_yarn_version }} --yarn-path"
        chdir: "{{ kroy_local_root }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true

    - name: Disable the global Yarn cache locally
      ansible.builtin.lineinfile:
        path: "{{ kroy_local_root }}/.yarnrc.yml"
        regexp: '^enableGlobalCache:'
        line: 'enableGlobalCache: false'
        create: true
        mode: '0644'
      delegate_to: localhost
      become: false
      run_once: true

    - name: Install Kroy dependencies locally
      ansible.builtin.command:
        cmd: yarn install --immutable
        chdir: "{{ kroy_local_root }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true

    - name: Check local Yarn PnP artifacts
      ansible.builtin.stat:
        path: "{{ kroy_local_root }}/{{ item }}"
      loop:
        - .pnp.cjs
        - .pnp.loader.mjs
        - .yarn/cache
        - .yarn/unplugged
        - ".yarn/releases/yarn-{{ kroy_yarn_version }}.cjs"
        - .yarnrc.yml
      register: kroy_local_yarn_artifacts
      delegate_to: localhost
      become: false
      run_once: true

    - name: Require local Yarn PnP artifacts
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "Missing local Yarn artifact: {{ item.stat.path }}"
      loop: "{{ kroy_local_yarn_artifacts.results }}"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Build Kroy locally
      ansible.builtin.command:
        cmd: yarn vyaz:build
        chdir: "{{ kroy_local_root }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true

    - name: Synchronize Kroy sources without deleting server data
      ansible.posix.synchronize:
        src: "{{ kroy_local_root }}/"
        dest: "{{ kroy_root }}/"
        archive: true
        delete: false
        owner: false
        group: false
        perms: true
        rsync_opts:
          - "--chmod=D2770,Fug+rwX,o-rwx"
          - "--omit-dir-times"
          - "--exclude=.git"
          - "--exclude=.env"
          - "--exclude=dist/sites/"
          - "--exclude=dist/kroy/nginx/"
          - "--exclude=data/"
          - "--exclude=/node_modules/"
          - "--exclude=.cache/"
          - "--exclude=*.log"
          - "--exclude=ansible/"
      notify: Restart Kroy app

    - name: Apply PostgreSQL migrations
      become: true
      become_user: "{{ kroy_user }}"
      ansible.builtin.command:
        argv:
          - "{{ kroy_node_binary }}"
          - "{{ kroy_yarn_release }}"
          - db:migrate
        chdir: "{{ kroy_root }}"
      changed_when: true

    - name: Install Kroy application systemd unit
      become: true
      ansible.builtin.template:
        src: templates/kroy-app.service.j2
        dest: /etc/systemd/system/kroy-app.service
        mode: '0644'
      notify: Restart Kroy app

    - name: Enable and start Kroy application before Nginx
      become: true
      ansible.builtin.systemd:
        name: kroy-app
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart Kroy app
      become: true
      ansible.builtin.systemd:
        name: kroy-app
        state: restarted

- import_playbook: kroy-nginx.yml
