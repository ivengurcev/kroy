---
- import_playbook: kroy-provision.yml

- name: Transfer and build Kroy on the VPS
  hosts: kroy
  become: false
  vars:
    kroy_root: /srv/kroy
    kroy_user: kroy
    kroy_group: "{{ kroy_user }}"
    kroy_yarn_version: 4.18.1
    kroy_yarn_binary: "{{ kroy_root }}/.yarn/releases/yarn-{{ kroy_yarn_version }}.cjs"
    kroy_local_root: "{{ playbook_dir }}/.."
  tasks:
    - name: Pin the project Yarn release locally
      ansible.builtin.command:
        cmd: "yarn set version {{ kroy_yarn_version }}"
        chdir: "{{ kroy_local_root }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true

    - name: Install Kroy dependencies locally
      ansible.builtin.command:
        cmd: yarn install --immutable
        chdir: "{{ kroy_local_root }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true

    - name: Build Kroy locally
      ansible.builtin.command:
        cmd: yarn vyaz:build
        chdir: "{{ kroy_local_root }}"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true

    - name: Synchronize Kroy sources without deleting server data
      ansible.posix.synchronize:
        src: "{{ kroy_local_root }}/"
        dest: "{{ kroy_root }}/"
        archive: true
        delete: false
        owner: false
        group: false
        perms: true
        rsync_opts:
          - "--chmod=D2770,Fug+rwX,o-rwx"
          - "--omit-dir-times"
          - "--exclude=.git"
          - "--exclude=.env"
          - "--exclude=dist/sites/"
          - "--exclude=dist/kroy/nginx/"
          - "--exclude=data/"
          - "--exclude=node_modules/"
          - "--exclude=.yarn/unplugged/"
          - "--exclude=.cache/"
          - "--exclude=*.log"
          - "--exclude=ansible/"
      notify: Restart Kroy app

    - name: Apply PostgreSQL migrations
      become: true
      become_user: "{{ kroy_user }}"
      ansible.builtin.command:
        cmd: "{{ kroy_yarn_binary }} db:migrate"
        chdir: "{{ kroy_root }}"
      changed_when: true

    - name: Install Kroy application systemd unit
      become: true
      ansible.builtin.template:
        src: templates/kroy-app.service.j2
        dest: /etc/systemd/system/kroy-app.service
        mode: '0644'
      notify: Restart Kroy app

    - name: Enable and start Kroy application before Nginx
      become: true
      ansible.builtin.systemd:
        name: kroy-app
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart Kroy app
      ansible.builtin.systemd:
        name: kroy-app
        state: restarted
        daemon_reload: true

- import_playbook: kroy-nginx.yml
