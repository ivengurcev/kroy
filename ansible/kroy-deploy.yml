---
- import_playbook: kroy-bootstrap.yml

- name: Transfer and build Kroy on the VPS
  hosts: kroy
  become: false
  vars:
    kroy_root: /srv/kroy
    kroy_user: kroy
    kroy_group: "{{ kroy_user }}"
  tasks:
    - name: Synchronize Kroy sources without deleting server data
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../"
        dest: "{{ kroy_root }}/"
        archive: true
        delete: false
        owner: false
        group: false
        perms: true
        rsync_opts:
          - "--chmod=D2770,Fug+rwX,o-rwx"
          - "--exclude=.git"
          - "--exclude=.env"
          - "--exclude=dist/"
          - "--exclude=node_modules/"
          - "--exclude=.yarn/cache/"
          - "--exclude=.yarn/unplugged/"
          - "--exclude=.cache/"
          - "--exclude=*.log"
          - "--exclude=ansible/"

    - name: Install VPS dependencies from the transferred lockfile
      become: true
      become_user: "{{ kroy_user }}"
      ansible.builtin.command:
        cmd: yarn install --immutable
        chdir: "{{ kroy_root }}"
      changed_when: true

    - name: Build Kroy on the VPS
      become: true
      become_user: "{{ kroy_user }}"
      ansible.builtin.command:
        cmd: yarn vyaz:build
        chdir: "{{ kroy_root }}"
      changed_when: true

- import_playbook: kroy-nginx.yml
