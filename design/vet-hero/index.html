<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f5f2" />
  <title>Алёна Путинцева — семейный ветеринарный врач</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f6f5f2;
      --text: #10221e;
      --accent: #355851;
      --border: rgba(36, 64, 57, .24);
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--text); }
    a { color: inherit; }

    .hero {
      position: relative;
      isolation: isolate;
      height: 100svh;
      min-height: 750px;
      max-height: 1150px;
      overflow: hidden;
      background: var(--background);
    }

    /* Изображение — отдельный слой, а не часть HTML-текста. */
    .hero__photo {
      position: absolute;
      z-index: -2;
      inset: 0 0 0 auto;
      width: 54%;
      background: url("./assets/hero-photo.jpg") 50% 12% / cover no-repeat;
    }

    .hero__photo::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
        var(--background) 0%,
        rgba(246, 245, 242, .78) 6%,
        rgba(246, 245, 242, 0) 31%);
    }

    .hero__inner {
      width: min(100%, 1760px);
      height: 100%;
      margin-inline: auto;
      position: relative;
    }

    .hero__content {
      position: absolute;
      top: 25%;
      left: 5.1%;
      max-width: 720px;
      width: 57%;
    }

    .hero__eyebrow {
      margin: 0 0 clamp(48px, 6.6vh, 82px);
      font-size: clamp(18px, 1.65vw, 27px);
      line-height: 1.3;
      font-weight: 400;
      letter-spacing: .21em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .hero__title {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(51px, 5.2vw, 82px);
      line-height: 1.07;
      font-weight: 400;
      letter-spacing: -.038em;
      text-wrap: balance;
    }

    .hero__socials {
      position: absolute;
      bottom: 6.3%;
      left: 5.1%;
      display: flex;
      align-items: center;
      gap: 0;
    }

    .hero__social {
      display: inline-flex;
      align-items: center;
      gap: 15px;
      padding: 4px 27px 4px 0;
      min-height: 54px;
      font-size: 17px;
      line-height: 1.25;
      text-decoration: none;
      white-space: nowrap;
      transition: color .2s;
    }

    .hero__social + .hero__social {
      border-left: 1px solid var(--border);
      margin-left: 0;
      padding-left: 27px;
    }

    .hero__social:hover { color: #21786b; }
    .hero__social:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }

    .hero__icon {
      width: 51px;
      height: 51px;
      border-radius: 50%;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      background: #e3e7e2;
      color: var(--accent);
      flex: 0 0 auto;
    }

    .hero__icon svg { width: 24px; height: 24px; }
    .hero__max-mark { font-size: 11px; font-weight: 700; letter-spacing: -.03em; }

    .hero__caption {
      position: absolute;
      right: 4.1%;
      bottom: 5.9%;
      width: clamp(210px, 17.5vw, 270px);
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 18px;
      background: rgba(247, 247, 244, .77);
      -webkit-backdrop-filter: blur(9px);
      backdrop-filter: blur(9px);
    }

    .hero__name {
      margin: 0 0 9px;
      font: 400 clamp(19px, 1.5vw, 23px)/1.16 Georgia, 'Times New Roman', serif;
    }

    .hero__description {
      margin: 0;
      font-size: clamp(13px, 1vw, 16px);
      line-height: 1.45;
      color: #3b4743;
    }

    @media (max-width: 1100px) {
      .hero__content { max-width: 610px; width: 62%; }
      .hero__title { font-size: clamp(48px, 5.7vw, 67px); }
      .hero__photo { width: 58%; }
    }

    @media (max-width: 760px) {
      .hero { min-height: 970px; max-height: none; height: 100svh; }
      .hero__photo {
        inset: 0 0 auto 0;
        width: 100%;
        height: 55%;
        background-position: 50% 29%;
      }
      .hero__photo::before {
        background: linear-gradient(180deg,
          transparent 65%, rgba(246, 245, 242, .2) 77%, var(--background) 100%);
      }
      .hero__content {
        top: 53%;
        left: 6%;
        width: 88%;
        max-width: none;
      }
      .hero__eyebrow {
        font-size: clamp(14px, 3.1vw, 19px);
        letter-spacing: .13em;
        margin-bottom: 28px;
      }
      .hero__title {
        font-size: clamp(43px, 8.5vw, 65px);
        line-height: 1.07;
      }
      .hero__caption {
        top: 34%;
        right: 6%;
        bottom: auto;
        width: 165px;
        padding: 17px;
      }
      .hero__name { font-size: 19px; }
      .hero__description { font-size: 13px; }
      .hero__socials {
        left: 6%;
        right: 6%;
        bottom: 3.5%;
        justify-content: space-between;
      }
      .hero__social { gap: 7px; padding-right: 12px; font-size: 13px; }
      .hero__social + .hero__social { padding-left: 12px; }
      .hero__icon { width: 38px; height: 38px; }
      .hero__icon svg { width: 20px; height: 20px; }
      .hero__max-mark { font-size: 9px; }
    }

    @media (min-width: 761px) {
      .hero__name { white-space: nowrap; }
    }

    @media (max-width: 390px) {
      .hero__title { font-size: 42px; }
      .hero__social { font-size: 12px; gap: 6px; padding-right: 7px; }
      .hero__social + .hero__social { padding-left: 7px; }
      .hero__icon { width: 33px; height: 33px; }
    }

    @media (max-width: 350px) {
      .hero__socials { flex-wrap: wrap; justify-content: flex-start; gap: 4px 12px; }
      .hero__social + .hero__social { border: 0; padding-left: 0; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__photo" aria-hidden="true"></div>
      <div class="hero__inner">
        <div class="hero__content">
          <p class="hero__eyebrow">Семейный ветеринарный врач</p>
          <h1 class="hero__title" id="hero-title">
            Забота о здоровье питомца — спокойно и по делу
          </h1>
        </div>

        <nav class="hero__socials" aria-label="Социальные сети">
          <a class="hero__social" href="https://t.me/vetputintseva" target="_blank" rel="noopener noreferrer">
            <span class="hero__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 3.2c.6-.3 1.2.2 1 1l-3.3 15.5c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.4-8.5c.4-.4-.1-.6-.6-.3L6.7 13.2l-4.9-1.5c-1.1-.3-1.1-1.1.2-1.6z"/></svg>
            </span>
            Telegram
          </a>
          <!-- Подставить ссылку на реальный профиль MAX. -->
          <a class="hero__social" href="#max">
            <span class="hero__icon" aria-hidden="true"><span class="hero__max-mark">MAX</span></span>
            MAX
          </a>
          <!-- Подставить ссылку на реальный профиль Instagram. -->
          <a class="hero__social" href="#instagram">
            <span class="hero__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.7" r=".8" fill="currentColor" stroke="none"/></svg>
            </span>
            Instagram
          </a>
        </nav>

        <div class="hero__caption">
          <p class="hero__name">Алёна Путинцева</p>
          <p class="hero__description">Ветеринарный врач с 20-летним стажем</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
